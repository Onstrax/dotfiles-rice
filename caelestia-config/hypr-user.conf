# Configuración personal de Hyprland para Caelestia.
# Este archivo se carga al final desde ~/.config/hypr/hyprland.conf.
# Mantener aquí solo imports para que los cambios personales estén ordenados.

source = ~/.config/caelestia/hypr-user.d/10-window-rules.conf
source = ~/.config/caelestia/hypr-user.d/20-workspace-rules.conf
source = ~/.config/caelestia/hypr-user.d/30-system-binds.conf
source = ~/.config/caelestia/hypr-user.d/40-hardware-binds.conf
source = ~/.config/caelestia/hypr-user.d/50-user-gestures.conf
source = ~/.config/caelestia/hypr-user.d/60-app-binds.conf
source = ~/.config/caelestia/hypr-user.d/70-user-execs.conf
