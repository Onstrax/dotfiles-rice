# ######## BINDS DE HARDWARE ########

# Rotar efectos de teclado (Fn + F8)
bindl = , F8, exec, ~/.config/caelestia/scripts/keyboard_rgb.sh

# Apagar iluminación (Fn + F7)
bindl = , F7, exec, msi-perkeyrgb --model ge63 -s 000000

# Control de Intensidad de Luz Inteligente (Ctrl + Shift + 0-9)
bindl = CONTROL SHIFT, 1, exec, ~/.config/caelestia/scripts/brillo_luz.sh 1
bindl = CONTROL SHIFT, 2, exec, ~/.config/caelestia/scripts/brillo_luz.sh 2
bindl = CONTROL SHIFT, 3, exec, ~/.config/caelestia/scripts/brillo_luz.sh 3
bindl = CONTROL SHIFT, 4, exec, ~/.config/caelestia/scripts/brillo_luz.sh 4
bindl = CONTROL SHIFT, 5, exec, ~/.config/caelestia/scripts/brillo_luz.sh 5
bindl = CONTROL SHIFT, 6, exec, ~/.config/caelestia/scripts/brillo_luz.sh 6
bindl = CONTROL SHIFT, 7, exec, ~/.config/caelestia/scripts/brillo_luz.sh 7
bindl = CONTROL SHIFT, 8, exec, ~/.config/caelestia/scripts/brillo_luz.sh 8
bindl = CONTROL SHIFT, 9, exec, ~/.config/caelestia/scripts/brillo_luz.sh 9
bindl = CONTROL SHIFT, 0, exec, ~/.config/caelestia/scripts/brillo_luz.sh 0
