# ######## REGLAS DE VENTANA (Nueva Sintaxis) ########

windowrule = match:class ^(zoom)$, float on
windowrule = match:class ^(onlyoffice-desktopeditors)$, tile on
windowrule = match:class ^(eDEX-UI)$, fullscreen on
windowrule = match:class ^(eDEX-UI)$, monitor 0

# Reglas para Steam y Juegos
windowrule = match:class ^(steam)$, match:title ^()$, min_size 1 1
windowrule = match:class ^(steam)$, match:title ^()$, stay_focused on
windowrule = match:class ^(steam_app_.*)$, immediate on

# Reglas para la calculadora
windowrule = match:class ^(qalculate-gtk)$, float on
windowrule = match:class ^(qalculate-gtk)$, center on
windowrule = match:class ^(qalculate-gtk)$, size 400 600
