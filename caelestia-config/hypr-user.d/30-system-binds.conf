# ######## BINDS DE SISTEMA / UTILIDADES ########

# Cambiar idioma del teclado (Super + Espacio)
bindl = SUPER, space, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next

# Live Wallpapers
bind = SUPER SHIFT, W, exec, __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia waypaper --random

# Bind para la calculadora
bind = , F1, exec, qalculate-gtk

# Bind Special Foot (Usando tu script)
bind = SUPER SHIFT, T, exec, ~/.config/caelestia/scripts/toggle_term.sh

# Bloquea y suspende
bindl = SUPER SHIFT, L, exec, hyprlock & sleep 0.2 && systemctl suspend

# Handy STT - Push to Talk forzando entorno CUDA de Nvidia
bind = Ctrl, Space, exec, env CUDA_VISIBLE_DEVICES=0 ORT_PROVIDER=CUDAExecutionProvider ONNXRUNTIME_PROVIDER=CUDA handy --toggle-transcription
bindr = Ctrl, Space, exec, env CUDA_VISIBLE_DEVICES=0 ORT_PROVIDER=CUDAExecutionProvider ONNXRUNTIME_PROVIDER=CUDA handy --toggle-transcription

# Control de música (Fn + F9, F10, F11)
bindl = , F9, exec, playerctl play-pause
bindl = , F10, exec, playerctl previous
bindl = , F11, exec, playerctl next

# Restart Caelestia Shell safely
unbind = Ctrl+Super+Shift, R
unbind = Ctrl+Super+Alt, R

bindr = Ctrl+Super+Shift, R, exec, qs -c caelestia kill; pkill -x qs
bindr = Ctrl+Super+Alt, R, exec, qs -c caelestia kill; pkill -x qs; sleep 1; caelestia shell -d
