# --- REGLAS DE WORKSPACE (Asignaciones fijas) ---
# Se usa 'workspace X silent' después del match:class

windowrule = match:class ^(brave-init)$, workspace 1 silent
windowrule = match:title ^(foot-init)$, workspace 10 silent
windowrule = match:class ^(org.kde.dolphin)$, workspace 9 silent

windowrule = match:class ^(solanum|org.gnome.Solanum)$, workspace 7 silent
windowrule = match:class ^(code-oss|code|github-desktop-plus)$, workspace 2 silent
windowrule = match:class ^(vesktop|discord|brave-web.whatsapp.com__-Default)$, workspace 3 silent
windowrule = match:class ^(brave-outlook.office.com__mail_-Default|brave-mail.google.com__mail_u_0_-Default)$, workspace 4 silent
windowrule = match:class ^(obsidian)$, workspace 5 silent
windowrule = match:class ^(steam)$, workspace 6 silent
windowrule = match:class ^(com.github.th_ch.youtube_music)$, workspace 8 silent
