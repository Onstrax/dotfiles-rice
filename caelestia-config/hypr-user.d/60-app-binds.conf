# ######## ATAJOS DE APLICACIONES ########

unbind = SUPER, D
unbind = SUPER, S
unbind = SUPER, G
unbind = SUPER, H

bind = SUPER, B, exec, brave
bind = SUPER, Z, exec, zen-browser
bind = SUPER, D, exec, vesktop
bind = SUPER, S, exec, prime-run steam
bind = SUPER, O, exec, ~/.config/caelestia/scripts/toggle_obsidian.sh
bind = SUPER, H, exec, github-desktop-plus
bind = SUPER+SHIFT, P, exec, solanum

# Web Apps
bind = SUPER, W, exec, ~/.config/caelestia/scripts/focus_or_launch.sh brave-web.whatsapp.com__-Default WebApp-WhatsApp2579
bind = SUPER, G, exec, ~/.config/caelestia/scripts/focus_or_launch.sh brave-mail.google.com__mail_u_0_-Default WebApp-Gmail1773
bind = SUPER SHIFT, O, exec, ~/.config/caelestia/scripts/focus_or_launch.sh brave-outlook.office.com__mail_-Default WebApp-Outlook3829
bind = SUPER, Y, exec, gtk-launch yt-music.desktop
