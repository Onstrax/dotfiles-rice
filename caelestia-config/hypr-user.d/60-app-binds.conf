# ######## ATAJOS DE APLICACIONES ########

unbind = SUPER, D
unbind = SUPER, S
unbind = SUPER, G
unbind = SUPER, H

bind = SUPER, B, exec, brave
bind = SUPER, Z, exec, zen-browser
bind = SUPER, D, exec, vesktop
bind = SUPER, S, exec, prime-run steam
bind = SUPER, O, exec, ~/.config/caelestia/scripts/toggle_obsidian.sh
bind = SUPER, H, exec, desktop-plus
bind = SUPER+SHIFT, P, exec, solanum

# Web Apps
bind = SUPER, W, exec, whatsie
bind = SUPER, G, exec, hyprctl clients | grep -q "FFPWA-01M1THMHBMYY2NME59SD1JHBVW" && hyprctl dispatch focuswindow "class:FFPWA-01M1THMHBMYY2NME59SD1JHBVW" || firefoxpwa site launch 01M1THMHBMYY2NME59SD1JHBVW
bind = SUPER SHIFT, O, exec, prospect-mail
bind = SUPER, Y, exec, gtk-launch yt-music.desktop
